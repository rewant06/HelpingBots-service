[tool.poetry]
name = "ai-doctor"
version = "0.1.0"
description = "Dr. Reach Medical Triage Microservice"
authors = ["Rewant <rewant06@github.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.124.2"   # Dec 2025 release
uvicorn = {extras = ["standard"], version = "^0.38.0"}
pydantic = "^2.12.5"   # Latest Core validation speedups
python-dotenv = "^1.2.0"
langgraph = "^1.0.4"
langchain-core = "^1.1.3"
httpx = "^0.28.1"
langchain-openai = "^1.1.3"
supabase = "^2.25.1"
langchain-google-genai = "^4.0.0"
google-generativeai = "^0.8.5"
websockets = "^15.0.1"
asyncpg = "^0.29.0"

[tool.poetry.group.dev.dependencies]
black = "^25.12.0"     # 2025 Style guide
pytest = "^8.3.4"     
pytest-asyncio = "^0.25.0" # Required for testing async FastAPI routes

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
